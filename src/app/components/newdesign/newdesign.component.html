<div class="new-design-wrapper">
    <div class="form-card">
      <h2>Upload Room Image</h2>
      <p>Upload a photo of your room for AI transformation</p>
  
      <form>
        <label>
          Project Name
          <input type="text" placeholder="My Living Room Redesign" />
        </label>
  
        <div class="row">
          <label>
            Room Type
            <select>
              <option>Select room type</option>
            </select>
          </label>
  
          <label>
            Design Style
            <select>
              <option>Select design style</option>
            </select>
          </label>
        </div>
  
        <label>
          Description (Optional)
          <textarea placeholder="Add any specific details about your design vision..."></textarea>
        </label>
  
        <label class="upload-box">
          <div class="icon">
            <i class="fas fa-upload"></i>
          </div>
          <p>Drag and drop your image here or click to browse</p>
          <small>Supports JPG, PNG, WEBP up to 10MB</small>
          <button type="button" class="browse-btn"><i class="fas fa-image"></i> Browse Files</button>
        </label>
  
        <button type="submit" class="submit-btn">Generate AI Design</button>
      </form>
    </div>
  </div>
